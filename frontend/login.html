<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - Pharma++</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: linear-gradient(120deg, #a6c0fe, #f68084); height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { background: rgba(255,255,255,0.8); backdrop-filter: blur(10px); border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
    a { text-decoration: none; font-weight: bold; transition: 0.3s; }
    a:hover { color: #f68084 !important; }
  </style>
</head>
<body>
  <div class="card p-5 text-center shadow-lg" style="width: 400px;">
    <h2 class="fw-bold text-dark mb-4">🩺 Pharma++</h2>
    <form action="/login" method="POST">
      <div class="mb-3">
        <input type="text" name="username" class="form-control" placeholder="Username" required>
      </div>
      <div class="mb-4">
        <input type="password" name="password" class="form-control" placeholder="Password" required>
      </div>
      <button type="submit" class="btn btn-primary w-100 fw-bold">Login</button>
    </form>
    
    <!-- Link to go to Sign Up -->
    <div class="mt-4">
      <p class="text-muted">Don't have an account? <a href="/signup" class="text-primary">Create one</a></p>
    </div>
  </div>
</body>
</html>
